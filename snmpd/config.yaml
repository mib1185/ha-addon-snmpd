name: "SNMPD"
version: "0.6.0"
slug: "snmpd"
description: "Monitor your HA installation via snmp"
url: "https://github.com/mib1185/ha-addon-snmpd"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
image: mib85/{arch}-ha-addon-snmpd
init: false
startup: services
host_network: true
options:
  snmp_community: pmnsssah
  snmp_name: ha
  snmp_location: home
  snmp_contact: me
  snmp_port: 161
  lldp_enabled: false
schema:
  snmp_community: str
  snmp_name: str
  snmp_location: str
  snmp_contact: str
  snmp_port: port
  lldp_enabled: bool
  